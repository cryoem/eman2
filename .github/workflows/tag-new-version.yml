# -*- mode: yaml -*-

name: Tag new version
on:
  push:
    branches:
      - master

jobs:
  bump-and-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Parse commit message for bump type
        run: |
          if ${{ contains(github.event.head_commit.message, '[bump patch]') || contains(github.event.head_commit.message, '[ci build]') }}; then
            echo "bump=patch" >> $GITHUB_ENV
          elif ${{ contains(github.event.head_commit.message, '[bump minor]') }}; then
            echo "bump=minor" >> $GITHUB_ENV
          elif ${{ contains(github.event.head_commit.message, '[bump major]') }}; then
            echo "bump=major" >> $GITHUB_ENV
          fi

      - name: Checkout eman2
        if: ${{ env.bump }}
        uses: actions/checkout@v4
        with:
          path: 'eman2' # Isolates the main repo into its own subdirectory

      - name: Set up Git user
        if: ${{ env.bump }}
        run: |
          git config --global user.email "eman.github@gmail.com"
          git config --global user.name "eman-bot"

      - name: Bump and tag new version
        if: ${{ env.bump }}
        run: |
          cd eman2 # Move into the isolated repository folder
          git fetch --tags
          version=$(git tag -l 'v*' --sort=-v:refname | head -n 1)

          if [[ "$version" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
          fi

          case "${{ env.bump }}" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Unknown bump type: ${{ env.bump }}"
              exit 1
              ;;
          esac

          new_version="${major}.${minor}.${patch}"
          echo "new_version=${new_version}" >> $GITHUB_ENV

          echo "Current version: ${version}"
          echo "Requested bump : ${{ env.bump }}"
          echo "New version    : ${new_version}"
          
          sed -i "s/VERSION\s*[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*/VERSION ${new_version}/" CMakeLists.txt

          git add CMakeLists.txt
          git commit -m v${new_version}
          git tag -f v${new_version}
          git push origin master v${new_version}

      - name: Checkout eman-feedstock
        if: ${{ env.bump }}
        uses: actions/checkout@v4
        with:
          repository: cryoem/eman-feedstock
          token: ${{ secrets.FEEDSTOCK_TOKEN }} # Explicit push-enabled secret token
          path: 'eman-feedstock'                # Isolates feedstock to prevent over-writing

      - name: Update version in eman-feedstock
        if: ${{ env.bump }}
        run: |
          cd eman-feedstock
          
          # 1. Download the new archive payload directly from the newly created tag
          curl -L -o release.tar.gz "https://github.com{{ env.new_version }}.tar.gz"
          
          # 2. Calculate the raw SHA256 checksum string
          calculated_hash=$(sha256sum release.tar.gz | awk '{ print $1 }')
          echo "Calculated SHA256: $calculated_hash"
          rm release.tar.gz

          # 3. Use sed to swap in the new version number and calculated hash string
          sed -i 's/set\s*version\s*=\s*"[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*"/set version = "${{ env.new_version }}"/' recipe/meta.yaml
          sed -i "s/set\s*sha256\s*=\s*\"[^\"]*\"/set sha256 = \"$calculated_hash\"/" recipe/meta.yaml
          sed -i 's/set\s*build\s*=\s*[0-9][0-9]*/set build = 0/' recipe/meta.yaml

          # 4. Commit and push directly using the secure FEEDSTOCK_TOKEN
          git add recipe/meta.yaml
          git commit -m "v${{ env.new_version }} and hash updates"
          git push origin master

