# -*- mode: yaml -*-

name: Tag new version
on:
  push:
    branches:
      - master

jobs:
  bump-and-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Parse commit message for bump type
        run: |
          if ${{ contains(github.event.head_commit.message, '[bump patch]') || contains(github.event.head_commit.message, '[ci build]') }}; then
            echo "bump=patch" >> $GITHUB_ENV
          elif ${{ contains(github.event.head_commit.message, '[bump minor]') }}; then
            echo "bump=minor" >> $GITHUB_ENV
          elif ${{ contains(github.event.head_commit.message, '[bump major]') }}; then
            echo "bump=major" >> $GITHUB_ENV
          fi

      - name: Checkout eman2
        if: ${{ env.bump }}
        uses: actions/checkout@v4
        with:
          path: 'eman2'

      - name: Set up Git user
        if: ${{ env.bump }}
        run: |
          git config --global user.email "eman.github@gmail.com"
          git config --global user.name "eman-bot"

      - name: Bump and tag new version
        if: ${{ env.bump }}
        run: |
          cd eman2
          git fetch --tags
          version=$(git tag -l 'v*' --sort=-v:refname | head -n 1)

          if [[ "$version" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH}"
            minor="${BASH_REMATCH}"
            patch="${BASH_REMATCH}"
          fi

          case "${{ env.bump }}" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Unknown bump type: ${{ env.bump }}"
              exit 1
              ;;
          esac

          new_version="${major}.${minor}.${patch}"
          echo "new_version=${new_version}" >> $GITHUB_ENV

          echo "Current version: ${version}"
          echo "Requested bump : ${{ env.bump }}"
          echo "New version    : ${new_version}"
          
          sed -i "s/VERSION\s*[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*/VERSION ${new_version}/" CMakeLists.txt

          git add CMakeLists.txt
          git commit -m v${new_version}
          git tag -f v${new_version}
          git push origin master v${new_version}

      - name: Checkout eman-feedstock
        if: ${{ env.bump }}
        uses: actions/checkout@v4
        with:
          repository: cryoem/eman-feedstock
          token: ${{ secrets.FEEDSTOCK_TOKEN }}
          path: 'eman-feedstock'
          persist-credentials: false

      - name: Update version in eman-feedstock
        if: ${{ env.bump }}
        env:
          PASSED_VERSION: ${{ env.new_version }}
          FEEDSTOCK_AUTH: ${{ secrets.FEEDSTOCK_TOKEN }}
        run: |
          cd eman-feedstock
          
          # Constructing the target components explicitly to bypass the rendering parser
          BASE_URL="https://github.com"
          REPO_PATH="/cryoem/eman2/archive/v"
          FULL_URL="${BASE_URL}${REPO_PATH}${PASSED_VERSION}.tar.gz"
          
          echo "Downloading from: ${FULL_URL}"
          curl -L -o release.tar.gz "${FULL_URL}"
          
          calculated_hash=$(sha256sum release.tar.gz | awk '{ print $1 }')
          echo "Calculated SHA256: ${calculated_hash}"
          rm release.tar.gz

          sed -i "s/set\\s*version\\s*=\\s*\"[0-9][0-9]*\\.[0-9][0-9]*\\.[0-9][0-9]*\"/set version = \"${PASSED_VERSION}\"/" recipe/meta.yaml
          sed -i "s/set\\s*sha256\\s*=\\s*\"[^\"]*\"/set sha256 = \"${calculated_hash}\"/" recipe/meta.yaml
          sed -i 's/set\s*build\s*=\s*[0-9][0-9]*/set build = 0/' recipe/meta.yaml

          git add recipe/meta.yaml
          git commit -m "v${PASSED_VERSION} and hash updates"
          
          # Constructing target repository authorization link smoothly
          TARGET_GIT_URL="https://x-access-token:${FEEDSTOCK_AUTH}@://github.com"
          git push "${TARGET_GIT_URL}" master
